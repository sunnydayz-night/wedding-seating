<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Seating — Aishwarya & Surya</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --teal:       #1d3d3a;
    --teal-mid:   #2a5250;
    --teal-light: #3d6e6a;
    --teal-pale:  #6a9e99;
    --cream:      #f0eadc;
    --cream-deep: #e0d5c0;
    --cream-soft: #f7f3eb;
    --text-dark:  #0e201f;
    --text-soft:  #3d5e5b;
    --accent:     #c8a96e;
    --accent-pale:#e8d5a8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--cream-soft);
    font-family: 'EB Garamond', serif;
    color: var(--text-dark);
    min-height: 100vh;
  }

  /* ── Hero ── */
  .hero {
    position: relative;
    width: 100%;
    height: min(90vh, 700px);
    overflow: hidden;
  }

  .hero-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 20%;
    display: block;
  }



    to   { opacity: 1; transform: translateY(0); }
  }






  /* ── Search section ── */
  .search-section {
    background: var(--cream-soft);
    padding: 52px 24px 72px;
    text-align: center;
    position: relative;
  }

  .search-label {
    display: block;
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 2rem;
    color: var(--teal);
    margin-bottom: 20px;
    opacity: 1;
  }

  .search-wrap {
    position: relative;
    max-width: 520px;
    margin: 0 auto;
  }
  .search-wrap-outer {
    position: relative;
    max-width: 520px;
    margin: 0 auto;
  }

  .search-wrap input {
    width: 100%;
    padding: 16px 52px 16px 24px;
    border: 1.5px solid var(--cream-deep);
    border-radius: 2px;
    background: #ffffff;
    font-family: 'EB Garamond', serif;
    font-size: 1.1rem;
    color: var(--text-dark);
    outline: none;
    transition: border-color 0.25s, background 0.25s;
  }

  .search-wrap input:focus {
    border-color: var(--teal);
    background: #ffffff;
  }

  .search-wrap input::placeholder { color: #aaa; }

  .search-icon {
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--accent);
    font-size: 1rem;
    pointer-events: none;
  }

  /* ── Results ── */
  #results {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    z-index: 100;
    padding: 0;
    display: none;
  }
  #results.active {
    display: block;
  }

  .results-dropdown {
    background: #ffffff;
    border: 1px solid var(--cream-deep);
    border-top: 3px solid var(--teal);
    border-radius: 2px;
    box-shadow: 0 8px 32px rgba(29,61,58,0.15);
    max-height: 360px;
    overflow-y: auto;
    animation: slideIn 0.2s ease;
  }
  .result-card {
    padding: 16px 22px;
    border-bottom: 1px solid var(--cream-deep);
    cursor: default;
    transition: background 0.15s;
  }
  .result-card:last-child { border-bottom: none; }
  .result-card:hover { background: var(--cream-soft); }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .result-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem;
    font-weight: 500;
    color: var(--teal);
    margin-bottom: 4px;
  }

  .result-table-label {
    font-size: 0.7rem;
    font-family: 'Cinzel', serif;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 4px;
  }

  .result-table-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.8rem;
    font-weight: 300;
    color: var(--teal);
    line-height: 1;
  }

  .no-result {
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--text-soft);
    font-size: 1.1rem;
    padding: 16px 0 8px;
    max-width: 520px;
    margin: 0 auto;
    animation: slideIn 0.25s ease;
  }

  /* ── Wave divider ── */
  .wave-divider {
    display: block;
    width: 100%;
    overflow: hidden;
    line-height: 0;
    background: var(--teal);
  }
  .wave-divider svg { display: block; }

  /* ── Divider ornament ── */
  .divider {
    display: flex;
    align-items: center;
    gap: 14px;
    max-width: 560px;
    margin: 40px auto;
    padding: 0 24px;
  }
  .divider-line { flex: 1; height: 1px; background: linear-gradient(to right, transparent, var(--accent-pale)); }
  .divider-line.r { background: linear-gradient(to left, transparent, var(--accent-pale)); }
  .divider-sym { color: var(--accent); font-size: 0.85rem; }

  /* ── Tables grid ── */
  .tables-section {
    max-width: 900px;
    margin: 0 auto 64px;
    padding: 0 24px;
  }

  .section-title {
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 1.9rem;
    font-style: italic;
    color: var(--teal);
    margin-bottom: 28px;
  }

  .tables-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 18px;
  }

  .table-card {
    background: white;
    border: 1px solid var(--cream-deep);
    border-top: 3px solid var(--teal-light);
    border-radius: 2px;
    padding: 20px 18px 16px;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .table-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(29,61,58,0.1);
  }

  .table-card-header {
    display: flex;
    align-items: baseline;
    gap: 8px;
    border-bottom: 1px solid var(--cream-deep);
    padding-bottom: 10px;
    margin-bottom: 12px;
  }

  .table-num-badge {
    font-family: 'Cinzel', serif;
    font-size: 0.6rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--teal-pale);
  }

  .table-card-name {
    font-family: 'Cinzel', serif;
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--teal);
  }

  .table-guest {
    font-size: 0.95rem;
    color: var(--text-soft);
    padding: 3px 0;
    border-bottom: 1px dotted var(--cream-deep);
    font-family: 'EB Garamond', serif;
  }

  .table-guest:last-child { border-bottom: none; }

  .table-guest.highlight {
    background: rgba(29,61,58,0.07);
    color: var(--teal);
    font-weight: 500;
    border-radius: 2px;
    padding-left: 6px;
  }

  /* ── Footer ── */
  footer {
    background: var(--teal);
    text-align: center;
    padding: 32px 24px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1rem;
    color: var(--teal-pale);
    border-top: 1px solid var(--teal-mid);
  }

  footer span { color: var(--accent); }

  @media (max-width: 480px) {
    .tables-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
    .hero { height: 60vh; }
  }
</style>
</head>

const grid = document.getElementById('tablesGrid');
tables.forEach(t => {
  const card = document.createElement('div');
  card.className = 'table-card';
  card.innerHTML = `
    <div class="table-card-header">
      <span class="table-card-name">Table ${t.number}</span>
    </div>
    ${t.guests.map(g => `<div class="table-guest" data-name="${g.toLowerCase()}">${g}</div>`).join('')}
  `;
  grid.appendChild(card);
});

const input = document.getElementById('search');
const resultsEl = document.getElementById('results');

function scrollToGuest(guestName, tableNumber) {
  // Close dropdown
  resultsEl.innerHTML = '';
  resultsEl.classList.remove('active');
  input.value = guestName;

  // Clear previous highlights
  document.querySelectorAll('.table-guest.highlight').forEach(el => el.classList.remove('highlight'));

  // Find the table card and highlight the guest
  const guestEls = document.querySelectorAll(`.table-guest[data-name="${guestName.toLowerCase()}"]`);
  guestEls.forEach(el => el.classList.add('highlight'));

  // Scroll to the table card smoothly, offset for header
  if (guestEls.length > 0) {
    const card = guestEls[0].closest('.table-card');
    if (card) {
      const offset = 100;
      const top = card.getBoundingClientRect().top + window.scrollY - offset;
      window.scrollTo({ top, behavior: 'smooth' });
    }
  }
}

input.addEventListener('input', () => {
  const q = input.value.trim().toLowerCase();
  document.querySelectorAll('.table-guest.highlight').forEach(el => el.classList.remove('highlight'));

  if (!q) {
    resultsEl.innerHTML = '';
    resultsEl.classList.remove('active');
    return;
  }

  const matches = [];
  tables.forEach(t => {
    t.guests.forEach(g => {
      if (g.toLowerCase().includes(q)) matches.push({ guest: g, table: t });
    });
  });

  if (matches.length === 0) {
    resultsEl.innerHTML = `<div class="results-dropdown"><p class="no-result">No guest found matching "<em>${input.value}</em>"</p></div>`;
  } else {
    resultsEl.innerHTML = `<div class="results-dropdown">${matches.map(m => `
      <div class="result-card" onclick="scrollToGuest('${m.guest.replace(/'/g, "\'")}', ${m.table.number})" style="cursor:pointer;">
        <div class="result-name">${m.guest}</div>
        <div class="result-table-label">Your Table</div>
        <div class="result-table-num">${m.table.number}</div>
      </div>
    `).join('')}</div>`;
    matches.forEach(m => {
      document.querySelectorAll(`.table-guest[data-name="${m.guest.toLowerCase()}"]`).forEach(el => {
        el.classList.add('highlight');
      });
    });
  }
  resultsEl.classList.add('active');
});

// Close dropdown when clicking outside
document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrap-outer')) {
    resultsEl.innerHTML = '';
    resultsEl.classList.remove('active');
    document.querySelectorAll('.table-guest.highlight').forEach(el => el.classList.remove('highlight'));
  }
});
