<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Seating — Aishwarya & Surya</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --ivory: #faf6f0;
    --ivory-deep: #f2ead8;
    --gold: #b8922a;
    --gold-light: #d4a84b;
    --gold-pale: #e8d5a3;
    --gold-shine: #f0e0a0;
    --brown: #5c3d1e;
    --brown-light: #8a6240;
    --text: #2a1a0a;
    --text-soft: #6b5040;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--ivory);
    background-image:
      radial-gradient(ellipse at 15% 10%, rgba(212,168,75,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 85% 90%, rgba(184,146,42,0.07) 0%, transparent 50%),
      url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23b8922a' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    font-family: 'EB Garamond', serif;
    color: var(--text);
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    text-align: center;
    padding: 56px 24px 40px;
    position: relative;
  }
  header::after {
    content: '';
    display: block;
    width: 160px;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold), transparent);
    margin: 28px auto 0;
  }

  .ornament {
    font-size: 1.1rem;
    color: var(--gold);
    letter-spacing: 0.25em;
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    text-transform: uppercase;
    opacity: 0.75;
    margin-bottom: 14px;
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(2.6rem, 7vw, 4.2rem);
    color: var(--text);
    letter-spacing: 0.02em;
    line-height: 1.1;
  }
  h1 span {
    color: var(--gold);
    font-weight: 400;
  }

  .date-line {
    margin-top: 10px;
    font-family: 'Cinzel', serif;
    font-size: 0.72rem;
    letter-spacing: 0.3em;
    color: var(--text-soft);
    text-transform: uppercase;
  }

  /* ── Search ── */
  .search-section {
    max-width: 560px;
    margin: 40px auto 0;
    padding: 0 24px;
  }

  .search-label {
    display: block;
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.2rem;
    color: var(--text-soft);
    margin-bottom: 14px;
  }

  .search-wrap {
    position: relative;
  }

  .search-wrap input {
    width: 100%;
    padding: 16px 52px 16px 22px;
    border: 1.5px solid var(--gold-pale);
    border-radius: 2px;
    background: rgba(255,255,255,0.7);
    font-family: 'EB Garamond', serif;
    font-size: 1.1rem;
    color: var(--text);
    outline: none;
    transition: border-color 0.25s, box-shadow 0.25s;
    backdrop-filter: blur(4px);
  }

  .search-wrap input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(184,146,42,0.1);
  }

  .search-wrap input::placeholder { color: #b8a080; }

  .search-icon {
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--gold);
    font-size: 1.1rem;
    pointer-events: none;
  }

  /* ── Results ── */
  #results {
    max-width: 560px;
    margin: 18px auto 0;
    padding: 0 24px;
    min-height: 60px;
  }

  .result-card {
    background: linear-gradient(135deg, rgba(255,255,255,0.85), rgba(250,246,240,0.95));
    border: 1px solid var(--gold-pale);
    border-top: 3px solid var(--gold);
    padding: 28px 30px;
    border-radius: 2px;
    box-shadow: 0 8px 32px rgba(92,61,30,0.1), 0 2px 8px rgba(184,146,42,0.08);
    animation: slideIn 0.3s ease;
    margin-bottom: 12px;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .result-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.55rem;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 4px;
  }

  .result-table-label {
    font-size: 0.78rem;
    font-family: 'Cinzel', serif;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 6px;
  }

  .result-table-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.8rem;
    font-weight: 300;
    color: var(--brown);
    line-height: 1;
  }

  .result-table-name {
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 1rem;
    color: var(--text-soft);
    margin-top: 2px;
  }

  .no-result {
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--text-soft);
    font-size: 1.15rem;
    padding: 18px 0;
    animation: slideIn 0.25s ease;
  }

  /* ── Divider ── */
  .divider {
    display: flex;
    align-items: center;
    gap: 14px;
    max-width: 560px;
    margin: 44px auto;
    padding: 0 24px;
  }
  .divider-line { flex: 1; height: 1px; background: linear-gradient(to right, transparent, var(--gold-pale)); }
  .divider-line.r  { background: linear-gradient(to left, transparent, var(--gold-pale)); }
  .divider-sym { color: var(--gold); font-size: 1rem; }

  /* ── All Tables ── */
  .tables-section {
    max-width: 860px;
    margin: 0 auto 64px;
    padding: 0 24px;
  }

  .section-title {
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 1.9rem;
    font-style: italic;
    color: var(--text);
    margin-bottom: 28px;
  }

  .tables-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 20px;
  }

  .table-card {
    background: rgba(255,255,255,0.6);
    border: 1px solid var(--gold-pale);
    border-radius: 2px;
    padding: 22px 20px 18px;
    backdrop-filter: blur(4px);
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .table-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(184,146,42,0.12);
  }

  .table-card-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    border-bottom: 1px solid var(--gold-pale);
    padding-bottom: 10px;
    margin-bottom: 12px;
  }

  .table-num-badge {
    font-family: 'Cinzel', serif;
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .table-card-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.15rem;
    font-weight: 500;
    color: var(--brown);
  }

  .table-guest {
    font-size: 0.95rem;
    color: var(--text-soft);
    padding: 3px 0;
    border-bottom: 1px dotted rgba(184,146,42,0.18);
    font-family: 'EB Garamond', serif;
  }
  .table-guest:last-child { border-bottom: none; }

  /* ── QR Section ── */
  .qr-section {
    text-align: center;
    padding: 48px 24px 64px;
    background: linear-gradient(to bottom, transparent, rgba(242,234,216,0.5));
  }

  .qr-section-title {
    font-family: 'Cinzel', serif;
    font-size: 0.72rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 8px;
  }

  .qr-section-sub {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.1rem;
    color: var(--text-soft);
    margin-bottom: 28px;
  }

  .qr-frame {
    display: inline-block;
    padding: 16px;
    background: white;
    border: 1px solid var(--gold-pale);
    box-shadow: 0 4px 20px rgba(92,61,30,0.1);
    border-radius: 2px;
  }

  #qrcode canvas, #qrcode img { display: block; }

  .qr-url {
    margin-top: 14px;
    font-family: 'EB Garamond', serif;
    font-size: 0.9rem;
    color: var(--text-soft);
    word-break: break-all;
  }

  .btn-print {
    margin-top: 20px;
    display: inline-block;
    padding: 11px 28px;
    border: 1.5px solid var(--gold);
    font-family: 'Cinzel', serif;
    font-size: 0.68rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold);
    background: transparent;
    cursor: pointer;
    border-radius: 1px;
    transition: background 0.2s, color 0.2s;
    text-decoration: none;
  }
  .btn-print:hover { background: var(--gold); color: white; }

  /* ── Footer ── */
  footer {
    text-align: center;
    padding: 24px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.95rem;
    color: var(--gold-pale);
    border-top: 1px solid rgba(184,146,42,0.15);
  }

  /* ── Highlight match ── */
  .table-guest.highlight {
    background: rgba(212,168,75,0.12);
    color: var(--text);
    font-weight: 500;
    border-radius: 2px;
    padding-left: 6px;
  }

  @media (max-width: 480px) {
    .tables-grid { grid-template-columns: 1fr 1fr; gap: 14px; }
  }
</style>
</head>
<body>

<header>
  <p class="ornament">♦ &nbsp; Wedding Seating &nbsp; ♦</p>
  <h1><span>Aishwarya</span> &amp; <span>Surya</span></h1>
  <p class="date-line">Saturday, the Twenty-Third of May · 2026 · Pittsboro, North Carolina</p>
</header>

<section class="search-section">
  <label class="search-label" for="search">Find your seat</label>
  <div class="search-wrap">
    <input type="text" id="search" placeholder="Enter your name…" autocomplete="off" />
    <span class="search-icon">✦</span>
  </div>
</section>

<div id="results"></div>

<div class="divider">
  <div class="divider-line"></div>
  <span class="divider-sym">✦</span>
  <div class="divider-line r"></div>
</div>

<section class="tables-section">
  <h2 class="section-title">Seating by Table</h2>
  <div class="tables-grid" id="tablesGrid"></div>
</section>

<div class="divider">
  <div class="divider-line"></div>
  <span class="divider-sym">✦</span>
  <div class="divider-line r"></div>
</div>

<section class="qr-section">
  <p class="qr-section-title">Share this page</p>
  <p class="qr-section-sub">Scan to find your seat</p>
  <div class="qr-frame">
    <div id="qrcode"></div>
  </div>
  <p class="qr-url" id="qrUrl"></p>
  <br>
  <button class="btn-print" onclick="window.print()">Print QR Code</button>
</section>

<footer>Join us for an evening of love, laughter &amp; dancing &nbsp;✦&nbsp; May 23, 2026</footer>

<script>
// ── SEATING DATA — replace with your real guests ──────────────────────────
const tables = [
  {
    number: 1,
    name: "Rose",
    guests: ["Alexandra Whitfield", "James Whitfield", "Charlotte Moore", "Oliver Moore", "Eleanor Hart", "Sebastian Hart", "Vivienne Langley", "Thomas Langley"]
  },
  {
    number: 2,
    name: "Jasmine",
    guests: ["Margaret Chen", "David Chen", "Sophia Park", "Nathan Park", "Isabella Foster", "Liam Foster", "Amelia Nguyen", "Ethan Nguyen"]
  },
  {
    number: 3,
    name: "Lily",
    guests: ["Catherine Wells", "Henry Wells", "Diana Collins", "William Collins", "Grace Bennett", "Arthur Bennett", "Penelope Shaw", "Frederick Shaw"]
  },
  {
    number: 4,
    name: "Peony",
    guests: ["Harriet Dixon", "Charles Dixon", "Florence Turner", "Edward Turner", "Rosalind Page", "George Page", "Cecilia Hunt", "Alfred Hunt"]
  },
  {
    number: 5,
    name: "Wisteria",
    guests: ["Natalie Brooks", "Samuel Brooks", "Audrey Kim", "Daniel Kim", "Victoria Ross", "Michael Ross", "Juliette Price", "Jonathan Price"]
  },
  {
    number: 6,
    name: "Magnolia",
    guests: ["Annabelle Scott", "Patrick Scott", "Lucinda Morris", "Robert Morris", "Genevieve Reed", "Christopher Reed", "Evangeline Hayes", "Benjamin Hayes"]
  }
];
// ─────────────────────────────────────────────────────────────────────────────

// Build tables grid
const grid = document.getElementById('tablesGrid');
tables.forEach(t => {
  const card = document.createElement('div');
  card.className = 'table-card';
  card.innerHTML = `
    <div class="table-card-header">
      <span class="table-num-badge">Table ${t.number}</span>
      <span class="table-card-name">${t.name}</span>
    </div>
    ${t.guests.map(g => `<div class="table-guest" data-name="${g.toLowerCase()}">${g}</div>`).join('')}
  `;
  grid.appendChild(card);
});

// Search
const input = document.getElementById('search');
const resultsEl = document.getElementById('results');

input.addEventListener('input', () => {
  const q = input.value.trim().toLowerCase();
  // Clear highlights
  document.querySelectorAll('.table-guest.highlight').forEach(el => el.classList.remove('highlight'));

  if (!q) { resultsEl.innerHTML = ''; return; }

  const matches = [];
  tables.forEach(t => {
    t.guests.forEach(g => {
      if (g.toLowerCase().includes(q)) matches.push({ guest: g, table: t });
    });
  });

  if (matches.length === 0) {
    resultsEl.innerHTML = `<p class="no-result">No guest found matching "<em>${input.value}</em>"</p>`;
  } else {
    resultsEl.innerHTML = matches.map(m => `
      <div class="result-card">
        <div class="result-name">${m.guest}</div>
        <div class="result-table-label">Your Table</div>
        <div class="result-table-num">${m.table.number}</div>
        <div class="result-table-name">${m.table.name}</div>
      </div>
    `).join('');

    // Highlight in the table grid
    matches.forEach(m => {
      document.querySelectorAll(`.table-guest[data-name="${m.guest.toLowerCase()}"]`).forEach(el => {
        el.classList.add('highlight');
        el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
    });
  }
});

// QR Code — points to the current page URL
const pageUrl = window.location.href;
document.getElementById('qrUrl').textContent = pageUrl;
new QRCode(document.getElementById('qrcode'), {
  text: pageUrl,
  width: 180,
  height: 180,
  colorDark: "#2a1a0a",
  colorLight: "#ffffff",
  correctLevel: QRCode.CorrectLevel.H
});
</script>
</body>
</html>
